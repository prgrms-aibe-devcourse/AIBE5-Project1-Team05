<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="틈새 - 지도 | 서울의 모든 틈새 장소를 한눈에 확인하세요">
    <title>지도 | 틈새</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/theme.css">

    <!-- [변경된 부분] 서울 지도 스타일시트 추가 -->
    <link rel="stylesheet" href="css/seoul-map.css">
    <!-- [변경된 부분] 네이버 지도 API 스크립트 추가 -->
    <script type="text/javascript"
        src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=hcs4yltn62&submodules=gl"></script>
    <!-- [추가된 부분] TopoJSON 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>

    <style>
        /* [변경된 부분] 전체 화면 오버레이에 맞게 서울 지도 섹션 높이 조정 */
        .seoul-map-section.active {
            height: 100vh !important;
            padding: 0 !important;
        }

        /* [변경된 부분] 배경 투명화 처리 */
        .map-wrapper {
            background-color: transparent;
            /* 기존 불투명 배경 제거 */
        }

        /* [복구됨] 임베드 모드 스타일 (헤더 숨김 등) */
        body.is-embedded .header {
            display: none !important;
        }

        body,
        html {
            background-color: transparent;
            /* 배경을 투명하게 설정 */
            overflow: hidden;
            /* 지도 전체 화면 고정 */
        }
    </style>
    <script>
        // [복구됨] 임베드 모드 확인 (iframe 내에서 헤더 숨김 처리)
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('embed') === 'true') {
                document.body.classList.add('is-embedded');
            }
        });
    </script>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <a href="main.html" class="header__logo"><span class="logo-teum">틈</span><span
                        class="logo-gap"></span><span class="logo-sae">새</span></a>
                <nav class="header__nav">
                    <a href="main.html#places" class="header__link hover-underline">장소 탐색</a>
                    <a href="map.html" class="header__link hover-underline active">지도</a>
                    <a href="recommend.html" class="header__link hover-underline">AI 추천</a>
                    <a href="planner.html" class="header__link hover-underline">여행 계획</a>
                </nav>
                <div class="user-menu" id="user-menu">
                    <button class="user-btn">
                        <span class="user-avatar" id="user-avatar">G</span>
                        <span id="user-name">게스트</span>
                    </button>
                    <!-- User Dropdown -->
                    <div class="user-dropdown">
                        <div class="user-dropdown-header">
                            <div class="user-greeting">환영합니다!</div>
                            <div class="user-email" id="user-email">guest@teumsae.kr</div>
                        </div>
                        <a href="planner.html" class="user-dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                <line x1="16" y1="2" x2="16" y2="6" />
                                <line x1="8" y1="2" x2="8" y2="6" />
                                <line x1="3" y1="10" x2="21" y2="10" />
                            </svg>
                            내 여행 계획
                        </a>
                        <a href="#" class="user-dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                            </svg>
                            저장한 장소
                        </a>
                        <a href="recommend.html" class="user-dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon
                                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                            </svg>
                            AI 추천받기
                        </a>
                        <div class="user-dropdown-divider"></div>
                        <a href="#" class="user-dropdown-item logout" onclick="logout()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                            로그아웃
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- [변경된 부분] 기존 구글 지도 iframe을 삭제하고 서울 3D 지도 및 네이버 지도 섹션으로 교체 -->
        <div id="seoul-map-section" class="seoul-map-section active">
            <div class="map-wrapper" id="seoul-map-wrapper">
                <div class="map-controls">
                    <button class="map-mode-btn active" id="btn-mode-dong" onclick="SeoulMap.setMode('dong')">동
                        단위</button>
                    <button class="map-mode-btn" id="btn-mode-gu" onclick="SeoulMap.setMode('gu')">구 단위</button>
                </div>
                <svg class="seoul-map" viewBox="0 0 800 600" id="seoul-svg">
                    <text x="400" y="300" text-anchor="middle" id="loading-text">지도를 불러오는 중...</text>
                </svg>
            </div>

            <div id="naver-map-wrapper" class="naver-map-wrapper">
                <div id="naver-map" style="width:100%; height:100%;"></div>
                <button class="map-back-btn" onclick="SeoulMap.backToSeoul()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    전체 지도로
                </button>
            </div>
        </div>
    </main>

    <!-- Firebase SDK (Web v8.x - CDN) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Firebase Secrets (보안 설정 - Git에 커밋되지 않음) -->
    <script src="js/firebase-secrets.js"></script>

    <!-- Firebase Configuration -->
    <script src="js/firebase-config.js"></script>

    <!-- [변경된 부분] 서울 지도 로직 스크립트 연결 및 초기화 -->
    <script src="js/seoul-map.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            // Firebase 초기화
            if (typeof initializeFirebase === 'function') {
                initializeFirebase();
            } else {
                console.warn('Firebase 초기화 함수를 찾을 수 없습니다.');
            }

            // 페이지 로드 시 서울 지도 초기화
            if (typeof SeoulMap !== 'undefined' && SeoulMap.init) {
                SeoulMap.init();
            }
        });
    </script>

    <!-- Scripts -->
    <script src="js/logout.js"></script>
    <script>
        // Check login state
        function checkAuth() {
            const user = localStorage.getItem('teumsae_user') || sessionStorage.getItem('teumsae_user');
            if (!user) {
                return { isGuest: true };
            }
            return JSON.parse(user);
        }

        // Update user info
        function updateUserInfo(user) {
            const avatar = document.getElementById('user-avatar');
            const name = document.getElementById('user-name');
            if (!avatar || !name) return;

            if (user.isGuest) {
                avatar.textContent = 'G';
                name.textContent = 'Guest';
            } else {
                const initial = user.email ? user.email.charAt(0).toUpperCase() : 'U';
                avatar.textContent = initial;
                name.textContent = user.name || user.email.split('@')[0];
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const user = checkAuth();
            if (user) {
                updateUserInfo(user);
            }
        });
    </script>
</body>

</html>
